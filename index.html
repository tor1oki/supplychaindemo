<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d2d2d" />
    <meta
      name="description"
      content="Utility tools for supply chain modeling."
    />
    <title>Utility tools for supply chain modeling</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: "#2d2d2d",
                850: "#1f1f1f",
                950: "#121212",
              },
              cyan: {
                450: "#00e5ff",
              },
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["Fira Code", "monospace"],
            },
          },
        },
      };
    </script>

    <!-- Basic styles -->
    <style>
      html,
      body {
        background-color: #262626;
        color: #e5e5e5;
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        width: 100%;
        height: 100%;
      }

      #root {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + ReactDOM CDN -->
    <script type="module">
      import React from "https://esm.sh/react@19";
      import ReactDOM from "https://esm.sh/react-dom@19";

      // Your app component
      function App() {
        return React.createElement(
          "div",
          {
            className:
              "flex justify-center items-center h-full text-cyan-450 text-2xl",
          },
          "Hello, SupplyChain Demo!"
        );
      }

      // Render to root
      ReactDOM.render(
        React.createElement(App),
        document.getElementById("root")
      );
    </script>
  </body>
</html>
